name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundle: app
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundle: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: npm ci
        working-directory: desktop
      - name: Build unsigned macOS candidate
        if: runner.os == 'macOS'
        run: node scripts/build-release.mjs ${{ matrix.target }} app
      - name: Build signed Windows updater
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/build-release.mjs ${{ matrix.target }} nsis
      - name: Stage macOS candidate for local publisher signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          app="target/${{ matrix.target }}/release/bundle/macos/Ratatoskr Skill Sync.app"
          ditto --norsrc --noextattr --noacl -c -k --keepParent "$app" "artifacts/Ratatoskr-candidate-${{ matrix.platform }}.zip"
      - name: Stage signed Windows updater and helper
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p artifacts
          cp 'target/${{ matrix.target }}/release/ratatoskr.exe' artifacts/ratatoskr-windows-x86_64.exe
          cd desktop
          npm run tauri -- signer sign --app-version "$(node -p "require('./package.json').version")" ../artifacts/ratatoskr-windows-x86_64.exe
          cd ..
          version=$(node -p "require('./desktop/package.json').version")
          node scripts/collect-release.mjs 'target/${{ matrix.target }}/release/bundle' artifacts windows-x86_64 "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
