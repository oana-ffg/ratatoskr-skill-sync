name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked -p ratatoskr-core --example verify_release_artifact
      - name: Compare macOS launchd plist bytes with PR base
        if: runner.os == 'macOS' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/compare-macos-schedule.py
      - name: Migrate legacy tasks as a standard Windows user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-standard-user.ps1
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: desktop
      - run: npm run format:check
        working-directory: desktop
      - run: node --test scripts/tests/*.test.mjs
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: npm test
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo test --locked --workspace
      - run: npm run prepare:helper -- --debug
        working-directory: desktop
      - run: cargo clippy --locked -p ratatoskr-desktop -- -D warnings
      - run: cargo build --locked -p ratatoskr-desktop
      - name: Bundle macOS app
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app
        working-directory: desktop
      - name: Bundle Windows tray app installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
        working-directory: desktop
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          app="target/release/bundle/macos/Ratatoskr Skill Sync.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/ratatoskr"

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - run: npm run test:screenshots
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-screenshots
          path: docs/screenshots/*.png

  editor-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: desktop
      - run: npx playwright install --with-deps chromium webkit
        working-directory: desktop
      - run: npm run test:ui
        working-directory: desktop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: editor-ui-failures
          path: desktop/test-results/
