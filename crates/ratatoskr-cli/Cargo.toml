[package]
name = "ratatoskr-skill-sync"
default-run = "ratatoskr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "One source for agent skills, adapted per machine, OS and harness"

[[bin]]
name = "ratatoskr"
path = "src/main.rs"

[features]
# Only Windows packaging/CI enables this target; macOS keeps its single CLI.
windows-helper = []

[[bin]]
name = "ratatoskrw"
path = "src/windowless.rs"
required-features = ["windows-helper"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ratatoskr-core = { path = "../ratatoskr-core" }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
