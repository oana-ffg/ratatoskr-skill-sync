[package]
name = "ratatoskr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Conditional agent skill rendering and ownership-protected installation"

[dependencies]
toml_edit = "0.25"
yaml-edit = "0.3.2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
directories = "6"
fs2 = "0.4"
regex = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
similar = "2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
self-replace = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_System_Threading"] }

[dev-dependencies]
dunce = "1"
