[workspace]
members = ["crates/ratatoskr-core", "crates/ratatoskr-cli", "desktop/src-tauri"]
default-members = ["crates/ratatoskr-core", "crates/ratatoskr-cli"]
resolver = "2"

[workspace.package]
version = "0.2.14"
edition = "2024"
license = "MIT"
repository = "https://github.com/oana-ffg/ratatoskr-skill-sync"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
