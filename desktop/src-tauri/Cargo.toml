[package]
name = "ratatoskr-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Embedded W3C WebDriver server for the native end-to-end tests. Anything local can
# drive the app through it, so main.rs refuses to compile it into release builds.
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
serde_json.workspace = true
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
ratatoskr-core = { path = "../../crates/ratatoskr-core" }
# Modern NSIS updates use the signed installer directly; legacy ZIP updates are unnecessary.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
chrono = "0.4"
tokio = { version = "1", features = ["time", "sync"] }

tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[dev-dependencies]
dunce = "1"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
